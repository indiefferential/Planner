<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 --primary:#4c7cff;
 --success:#28a745;
 --warning:#ffc107;
 --danger:#dc3545;
 --bg:#f4f5f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;display:flex;height:100vh;background:var(--bg)}

/* SIDEBAR */
.sidebar{width:240px;background:#fff;padding:20px;border-right:1px solid #e5e5e5}
.sidebar h2{margin-bottom:20px}
.sidebar button{width:100%;margin-bottom:10px;padding:12px;border:none;background:#f1f2f4;border-radius:10px;cursor:pointer}
.sidebar button:hover{background:#e4e5e9}

/* MAIN */
.main{flex:1;padding:20px;overflow:auto}
button.primary{background:var(--primary);color:white;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;margin-bottom:15px}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
th{background:#fafafa;cursor:pointer}
tr:hover{background:#f7f9ff}

.overdue{color:var(--danger);font-weight:600}
.status{padding:4px 8px;border-radius:12px;color:white;font-size:12px}
.active{background:#ffc107}
.completed{background:#28a745}
.over{background:#dc3545}

/* PANEL */
.panel{width:340px;background:#fff;border-left:1px solid #e5e5e5;padding:20px}
input,textarea{width:100%;margin-bottom:12px;padding:10px;border-radius:8px;border:1px solid #ddd}
textarea{height:120px}
</style>
</head>
<body>

<div class="sidebar">
<h2>Tasks</h2>
<button onclick="setView('active')">Active</button>
<button onclick="setView('overdue')">Overdue</button>
<button onclick="setView('completed')">Completed</button>
<button onclick="setView('all')">All</button>
<hr style="margin:10px 0">
<button onclick="exportData()">Export</button>
<input type="file" id="importFile" hidden onchange="importData(event)">
<button onclick="document.getElementById('importFile').click()">Import</button>
</div>

<div class="main">
<button class="primary" onclick="newTask()">+ New Task</button>
<table>
<thead>
<tr>
<th onclick="sortBy('title')">Title</th>
<th onclick="sortBy('due')">Due</th>
<th>Time Left</th>
<th onclick="sortBy('updated')">Last Activity</th>
<th>Status</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<div class="panel">
<h3>Details</h3>
<input id="p_title" placeholder="Title">
<input id="p_due" type="date">
<textarea id="p_notes" placeholder="Notes"></textarea>
<textarea id="p_links" placeholder="Links (one per line)"></textarea>
<button class="primary" onclick="saveTask()">Save</button>
<button onclick="completeTask()">Complete</button>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")||"[]");
let selected=null;
let view='active';
let sort='due';

function save(){localStorage.setItem("tasks",JSON.stringify(tasks))}

/* CREATE */
function newTask(){
 const t={id:Date.now(),title:"New Task",due:new Date().toISOString().split('T')[0],notes:"",links:[],status:"active",updated:Date.now()}
 tasks.push(t)
 save()
 select(t.id)
 render()
}

/* SELECT */
function select(id){
 selected=tasks.find(t=>t.id===id)
 if(!selected)return
 p_title.value=selected.title
 p_due.value=selected.due
 p_notes.value=selected.notes
 p_links.value=selected.links.join("\n")
}

/* SAVE */
function saveTask(){
 if(!selected)return
 selected.title=p_title.value
 selected.due=p_due.value
 selected.notes=p_notes.value
 selected.links=p_links.value.split("\n")
 selected.updated=Date.now()
 save()
 render()
}

/* COMPLETE */
function completeTask(){
 if(!selected)return
 selected.status="completed"
 selected.updated=Date.now()
 save()
 render()
}

/* DELETE */
function deleteTask(id){
 if(!confirm("Delete task?"))return
 tasks=tasks.filter(t=>t.id!==id)
 selected=null
 save()
 render()
}

/* STATUS */
function overdue(t){return t.status==="active" && t.due && new Date(t.due)<new Date()}
function daysRemaining(t){
 if(!t.due)return ""
 const d=Math.ceil((new Date(t.due)-new Date())/(1000*60*60*24))
 if(d>1)return d+" days"
 if(d===1)return"1 day"
 if(d===0)return"Today"
 return"Overdue "+Math.abs(d)+"d"
}
function badge(t){
 if(t.status==="completed")return'<span class="status completed">Completed</span>'
 if(overdue(t))return'<span class="status over">Overdue</span>'
 return'<span class="status active">Active</span>'
}

/* VIEW */
function setView(v){view=v;render()}
function sortBy(s){sort=s;render()}

/* RENDER */
function render(){
 let list=[...tasks]

 if(view==="active")list=list.filter(t=>t.status==="active")
 if(view==="overdue")list=list.filter(t=>t.status==="active"&&overdue(t))
 if(view==="completed")list=list.filter(t=>t.status==="completed")
 if(view==="all")list=[...tasks]

 list.sort((a,b)=>{
  if(sort==="title")return a.title.localeCompare(b.title)
  if(sort==="due")return new Date(a.due||0)-new Date(b.due||0)
  if(sort==="updated")return b.updated-a.updated
 })

 rows.innerHTML=""
 list.forEach(t=>{
  const tr=document.createElement("tr")
  tr.onclick=()=>select(t.id)
  tr.innerHTML=`
   <td>${t.title}</td>
   <td class="${overdue(t)?'overdue':''}">${t.due||""}</td>
   <td class="${overdue(t)?'overdue':''}">${daysRemaining(t)}</td>
   <td>${new Date(t.updated).toLocaleString()}</td>
   <td>${badge(t)}</td>
   <td><button onclick="event.stopPropagation();deleteTask(${t.id})">🗑</button></td>
  `
  rows.appendChild(tr)
 })
}

/* BACKUP */
function exportData(){
 const blob=new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"})
 const a=document.createElement("a")
 a.href=URL.createObjectURL(blob)
 a.download="tasks.json"
 a.click()
}
function importData(e){
 const reader=new FileReader()
 reader.onload=()=>{tasks=JSON.parse(reader.result);save();render()}
 reader.readAsText(e.target.files[0])
}

render()
</script>
</body>
</html>
